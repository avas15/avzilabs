name = "avzilabs-catdogfish"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Served on its own subdomain rather than workers.dev. Keeping the game on a
# separate host from the Pages site means game traffic and the static site
# never share a request budget.
workers_dev = false

[[routes]]
pattern = "play.avzilabs.com"
custom_domain = true

# Allowed browser origins for the REST endpoints. The WebSocket upgrade is
# guarded by the room code rather than by origin.
[vars]
ALLOWED_ORIGINS = "https://avzilabs.com,https://www.avzilabs.com"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# One shared instance holding words the table has voted in. Separate from any
# official word list, deliberately.
[[durable_objects.bindings]]
name = "DICTIONARY"
class_name = "Dictionary"

# SQLite-backed Durable Objects are the only kind available on the Workers
# free plan, and they are what makes this game free to run.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Dictionary"]

[observability]
enabled = true
