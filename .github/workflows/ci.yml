name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan commits, not just the working tree.
          fetch-depth: 0

      # This repo is public and the author's machine holds .env files with real
      # keys from older projects. This gate is the reason a mistake there stays
      # a local mistake.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # Catches a broken canonical, a missing sitemap entry or an OG image that
      # stopped being generated, all of which fail silently in the browser.
      - name: Verify SEO artifacts
        run: |
          set -e
          test -f dist/sitemap-index.xml
          test -f dist/robots.txt
          test -f dist/rss.xml
          test -f dist/og/default.png
          if grep -rq 'canonical" href="[^"]*\.html"' dist/; then
            echo "Canonical URLs contain .html and will not match the sitemap"
            exit 1
          fi
          echo "SEO artifacts present and canonicals are clean"
